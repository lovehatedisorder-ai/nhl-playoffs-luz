<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUZ STUDIO | NHL 2026 - ROUND 2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Helvetica', Arial, sans-serif; }
        .luz-helvetica { font-family: 'Helvetica', Arial, sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // --- ICI TU PEUX CHANGER LES NOMS DES ÉQUIPES POUR LE ROUND 2 ---
        const INITIAL_TEAMS = {
            west: [
                { id: 'w_r2_1', t1: 'À Déterminer', city1: 'Ouest', t2: 'À Déterminer', city2: 'Ouest', s1: 0, s2: 0, seed1: '-', seed2: '-' },
                { id: 'w_r2_2', t1: 'À Déterminer', city1: 'Ouest', t2: 'À Déterminer', city2: 'Ouest', s1: 0, s2: 0, seed1: '-', seed2: '-' },
            ],
            east: [
                { id: 'e_r2_1', t1: 'À Déterminer', city1: 'Est', t2: 'À Déterminer', city2: 'Est', s1: 0, s2: 0, seed1: '-', seed2: '-' },
                { id: 'e_r2_2', t1: 'Lightning', city1: 'Tampa Bay', t2: 'Canadiens', city2: 'Montréal', s1: 0, s2: 0, seed1: '2', seed2: '3' },
            ]
        };

        function App() {
            const [userName, setUserName] = useState('');
            const [round2, setRound2] = useState(INITIAL_TEAMS);
            const bracketRef = useRef(null);

            const handleScoreChange = (side, seriesId, teamIndex, value) => {
                const score = Math.min(4, Math.max(0, parseInt(value) || 0));
                setRound2(prev => ({
                    ...prev,
                    [side]: prev[side].map(s => s.id === seriesId ? { ...s, [`s${teamIndex}`]: score } : s)
                }));
            };

            const exportAsImage = async () => {
                const canvas = await html2canvas(bracketRef.current, { 
                    backgroundColor: '#000000', 
                    scale: 2,
                    onclone: (clonedDoc) => {
                        clonedDoc.querySelectorAll('.team-name').forEach(el => {
                            el.style.lineHeight = '1.4';
                            el.style.paddingBottom = '5px';
                            el.style.display = 'block';
                        });
                    }
                });
                const link = document.createElement('a');
                link.href = canvas.toDataURL("image/png");
                link.download = `LUZ-ROUND2-${userName || 'prediction'}.png`;
                link.click();
            };

            const TeamRow = ({ name, city, score, seed, isWinner, isHabs, onChange }) => (
                <div className={`flex items-center justify-between p-4 rounded-lg ${isWinner ? 'bg-[#E3FC00]/20' : 'bg-black/30'}`}>
                    <div className="flex items-center gap-4 overflow-visible">
                        <span className="text-xs font-black text-zinc-600 w-4">{seed}</span>
                        <div className="flex flex-col overflow-visible">
                            <span className={`team-name text-xl font-black tracking-tighter block ${isHabs ? 'text-[#AF1E2D]' : 'text-white'} ${isWinner ? 'text-[#E3FC00]' : ''}`}>
                                {name.toUpperCase()}
                            </span>
                            <span className="city-name text-[10px] font-bold text-zinc-500 uppercase tracking-[0.2em]">{city}</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-3">
                        {isWinner && <span className="text-[#E3FC00]">🏆</span>}
                        <input 
                            type="number" 
                            value={score} 
                            onChange={(e) => onChange(e.target.value)}
                            className={`w-14 h-12 bg-black border-2 rounded-lg text-center text-2xl font-black outline-none ${isWinner ? 'border-[#E3FC00] text-[#E3FC00]' : 'border-zinc-800 text-zinc-500'}`}
                        />
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-6xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-end mb-16 gap-8">
                        <div className="space-y-4">
                            <div className="text-7xl font-bold uppercase tracking-tighter luz-helvetica">LUZ STUDIO</div>
                            <div className="flex items-center gap-3">
                                <div className="bg-[#AF1E2D] text-white text-xs font-black px-3 py-1 rounded italic">NHL PLAYOFFS 2026</div>
                                <div className="text-[#E3FC00] font-black text-xs tracking-widest uppercase">Deuxième Tour</div>
                            </div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                            <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Saisir votre nom</span>
                            <input 
                                type="text" 
                                placeholder="VOTRE NOM" 
                                value={userName}
                                onChange={(e) => setUserName(e.target.value)}
                                className="bg-zinc-900 border-2 border-zinc-800 p-4 rounded-2xl text-2xl font-black text-[#E3FC00] w-full md:w-80 outline-none focus:border-[#E3FC00] transition-all"
                            />
                        </div>
                    </header>

                    <button onClick={exportAsImage} className="bg-[#E3FC00] text-black font-black px-10 py-5 rounded-2xl font-black uppercase mb-12 shadow-xl hover:scale-105 transition-transform active:scale-95">
                        Sauvegarder vos prédictions
                    </button>

                    <div ref={bracketRef} className="bg-zinc-950 p-8 md:p-16 rounded-[50px] border border-zinc-900 shadow-2xl relative">
                        <div className="absolute top-0 right-0 p-12 text-8xl font-black text-white/5 italic select-none">R2</div>
                        
                        <div className="relative z-10 mb-16 flex justify-between items-end border-b border-zinc-900 pb-10">
                            <div>
                                <div className="text-[#E3FC00] font-black text-xs uppercase tracking-[0.5em] mb-2">Participant</div>
                                <div className="text-6xl font-black italic uppercase tracking-tighter">{userName || "À Définir"}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-zinc-500 font-bold text-xs uppercase tracking-widest mb-1">NHL Playoffs</div>
                                <div className="text-7xl font-black text-zinc-900 leading-none">2026</div>
                            </div>
                        </div>

                        <div className="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-16">
                            {/* OUEST */}
                            <div className="space-y-12">
                                <div className="flex items-center gap-4">
                                    <div className="bg-[#192168] px-6 py-3 font-black italic text-3xl rounded-xl shadow-lg">OUEST</div>
                                    <div className="h-px bg-zinc-800 flex-grow opacity-30"></div>
