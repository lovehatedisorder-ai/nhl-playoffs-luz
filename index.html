<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUZ STUDIO | FINALES CONFERENCES 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .winner-glow { box-shadow: 0 0 30px rgba(227, 252, 0, 0.4); border-color: #E3FC00 !important; }
        .luz-neon { color: #E3FC00; }
        .luz-bg-neon { background-color: #E3FC00; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // ÉQUIPES POUR LES FINALES DE CONFÉRENCE
        const ROUND_3_TEAMS = [
            { 
                id: 'west_final', 
                conf: 'OUEST',
                color: '#192168',
                t1: { name: 'Avalanche', city: 'Colorado' },
                t2: { name: 'Golden Knights', city: 'Vegas' }
            },
            { 
                id: 'east_final', 
                conf: 'EST',
                color: '#AF1E2D',
                t1: { name: 'Canadiens', city: 'Montréal' },
                t2: { name: 'Hurricanes', city: 'Caroline' }
            }
        ];

        // ÉCUSSONS TYPOGRAPHIQUES POUR ÉVITER LES LIENS BRISÉS
        const TeamBadge = ({ name }) => {
            if (name === 'Avalanche') {
                return (
                    <div class="w-12 h-12 rounded-xl bg-[#6F263D] border-2 border-[#236192] flex flex-col items-center justify-center shadow-lg flex-shrink-0">
                        <span class="text-white font-black text-[9px] tracking-tighter leading-none mb-0.5">COL</span>
                        <span class="text-lg leading-none">🏔️</span>
                    </div>
                );
            }
            if (name === 'Golden Knights') {
                return (
                    <div class="w-12 h-12 rounded-xl bg-[#212529] border-2 border-[#B4975A] flex flex-col items-center justify-center shadow-lg flex-shrink-0">
                        <span class="text-[#B4975A] font-black text-[9px] tracking-tighter leading-none mb-0.5">VGK</span>
                        <span class="text-lg leading-none">⚔️</span>
                    </div>
                );
            }
            if (name === 'Canadiens') {
                return (
                    <div class="w-12 h-12 rounded-xl bg-[#AF1E2D] border-2 border-[#192168] flex flex-col items-center justify-center shadow-lg flex-shrink-0">
                        <span class="text-white font-black text-base tracking-tight leading-none">CH</span>
                        <span class="text-[8px] text-white/60 font-bold uppercase tracking-widest mt-0.5">MTL</span>
                    </div>
                );
            }
            if (name === 'Hurricanes') {
                return (
                    <div class="w-12 h-12 rounded-xl bg-black border-2 border-[#FF2A00] flex flex-col items-center justify-center shadow-lg flex-shrink-0">
                        <span class="text-[#FF2A00] font-black text-[9px] tracking-tighter leading-none mb-0.5">CAR</span>
                        <span class="text-lg leading-none">🌀</span>
                    </div>
                );
            }
            return null;
        };

        function App() {
            const [userName, setUserName] = useState('');
            const [predictions, setPredictions] = useState({});
            const bracketRef = useRef(null);

            const selectWinner = (seriesId, teamName) => {
                setPredictions(prev => ({
                    ...prev,
                    [seriesId]: { ...prev[seriesId], winner: teamName, games: prev[seriesId]?.games || 6 }
                }));
            };

            const setGames = (seriesId, num) => {
                setPredictions(prev => ({
                    ...prev,
                    [seriesId]: { ...prev[seriesId], games: num }
                }));
            };

            const exportAsImage = async () => {
                const canvas = await html2canvas(bracketRef.current, { 
                    backgroundColor: '#000000', 
                    scale: 2 
                });
                const link = document.createElement('a');
                link.href = canvas.toDataURL("image/png");
                link.download = `LUZ-PREDICTIONS-2026.png`;
                link.click();
            };

            return (
                <div class="min-h-screen p-4 md:p-10 max-w-5xl mx-auto">
                    {/* HEADER */}
                    <header class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                        <div>
                            <h1 class="text-6xl font-black tracking-tighter mb-2">LUZ STUDIO</h1>
                            <div class="flex gap-3 items-center">
                                <span class="bg-[#AF1E2D] text-white px-3 py-1 text-xs font-black italic rounded">NHL 2026</span>
                                <span class="text-[#E3FC00] font-black uppercase text-xs tracking-widest">Finales de Conférence</span>
                            </div>
                        </div>
                        <div class="flex flex-col md:items-end gap-2 w-full md:w-auto">
                            <label class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest">Saisir ton nom</label>
                            <input 
                                type="text" 
                                placeholder="TON NOM" 
                                class="bg-zinc-900 border-2 border-zinc-800 p-4 rounded-2xl text-2xl font-black text-[#E3FC00] outline-none focus:border-[#E3FC00] transition-all w-full md:w-80"
                                onChange={(e) => setUserName(e.target.value)}
                            />
                        </div>
                    </header>

                    <button 
                        onClick={exportAsImage}
                        class="luz-bg-neon text-black font-black px-10 py-5 rounded-2xl uppercase mb-10 hover:scale-105 transition-transform shadow-xl"
                    >
                        Sauvegarder vos prédictions
                    </button>

                    {/* BRACKET AREA */}
                    <div ref={bracketRef} class="bg-zinc-950 p-6 md:p-12 rounded-[40px] border border-zinc-900 shadow-2xl relative overflow-visible">
                        <div class="relative z-10 flex justify-between items-end mb-12 border-b border-zinc-900 pb-8">
                            <div>
                                <p class="luz-neon text-[10px] font-black tracking-[0.4em] uppercase mb-1">Feuille Officielle de</p>
                                <h2 class="text-5xl font-black italic uppercase tracking-tighter text-white">{userName || "À Définir"}</h2>
                            </div>
                            <div class="text-right">
                                <p class="text-zinc-600 font-bold text-xs uppercase tracking-widest">Stanley Cup Playoffs</p>
                                <p class="text-6xl font-black text-zinc-900 leading-none">2026</p>
                            </div>
                        </div>

                        <div class="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-12">
                            {ROUND_3_TEAMS.map(series => (
                                <div key={series.id} class="space-y-6">
                                    <div class="flex items-center gap-4">
                                        <div style={{backgroundColor: series.color}} class="px-5 py-2 font-black italic text-2xl rounded-xl shadow-lg text-white">
                                            {series.conf}
                                        </div>
                                        <div class="h-[2px] bg-gradient-to-r from-zinc-800 to-transparent flex-grow opacity-50"></div>
                                    </div>

                                    <div class="bg-zinc-900/40 p-6 rounded-[32px] border border-zinc-800 space-y-4 shadow-inner">
                                        {/* TEAM 1 */}
                                        <div 
                                            onClick={() => selectWinner(series.id, series.t1.name)}
                                            class={`cursor-pointer p-5 rounded-2xl border-2 transition-all duration-300 flex items-center justify-between gap-4 ${predictions[series.id]?.winner === series.t1.name ? 'winner-glow bg-[#E3FC00]/10 border-[#E3FC00]' : 'bg-black border-transparent hover:border-zinc-800'}`}
                                        >
                                            <div class="flex items-center gap-4 overflow-visible">
                                                <TeamBadge name={series.t1.name} />
                                                <div class="flex flex-col">
                                                    <span class={`text-xl font-black italic ${series.t1.name === 'Canadiens' ? 'text-[#AF1E2D]' : 'text-white'}`}>{series.t1.name.toUpperCase()}</span>
                                                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">{series.t1.city}</span>
                                                </div>
                                            </div>
                                            {predictions[series.id]?.winner === series.t1.name && <span class="text-[#E3FC00] font-black text-xs italic bg-[#E3FC00]/10 px-2 py-1 rounded">GAGNANT</span>}
                                        </div>

                                        <div class="text-center text-zinc-800 font-black italic text-xs select-none">VS</div>

                                        {/* TEAM 2 */}
                                        <div 
                                            onClick={() => selectWinner(series.id, series.t2.name)}
                                            class={`cursor-pointer p-5 rounded-2xl border-2 transition-all duration-300 flex items-center justify-between gap-4 ${predictions[series.id]?.winner === series.t2.name ? 'winner-glow bg-[#E3FC00]/10 border-[#E3FC00]' : 'bg-black border-transparent hover:border-zinc-800'}`}
                                        >
                                            <div class="flex items-center gap-4 overflow-visible">
                                                <TeamBadge name={series.t2.name} />
                                                <div class="flex flex-col">
                                                    <span class={`text-xl font-black italic ${series.t2.name === 'Canadiens' ? 'text-[#AF1E2D]' : 'text-white'}`}>{series.t2.name.toUpperCase()}</span>
                                                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">{series.t2.city}</span>
                                                </div>
                                            </div>
                                            {predictions[series.id]?.winner === series.t2.name && <span class="text-[#E3FC00] font-black text-xs italic bg-[#E3FC00]/10 px-2 py-1 rounded">GAGNANT</span>}
                                        </div>

                                        {/* GAMES SELECTOR */}
                                        {predictions[series.id]?.winner && (
                                            <div class="pt-6 mt-4 border-t border-zinc-900">
                                                <p class="text-center text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3">En combien de matchs ?</p>
                                                <div class="flex justify-center gap-2">
                                                    {[4, 5, 6, 7].map(n => (
                                                        <button
                                                            key={n}
                                                            onClick={() => setGames(series.id, n)}
                                                            class={`w-12 h-12 rounded-full font-black text-lg transition-all ${predictions[series.id]?.games === n ? 'luz-bg-neon text-black scale-105 shadow-md' : 'bg-zinc-800 text-zinc-400 hover:text-white'}`}
                                                        >
                                                            {n}
                                                        </button>
                                                    ))}
                                                </div>
                                                <p class="text-center mt-4 text-[#E3FC00] font-black italic text-base">
                                                    {predictions[series.id].winner.toUpperCase()} EN {predictions[series.id].games}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div class="mt-12 text-center text-zinc-800 font-black uppercase text-[10px] tracking-[0.8em] opacity-30">
                            LUZ STUDIO • DIGITAL BRACKET SHEET
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
